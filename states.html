<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maind X Eyes — states (A1–E2)</title>
  <link rel="stylesheet" href="states.css">
  <link rel="stylesheet" href="state-keyframes.css">
</head>
<body class="tint-cyan">
  <header class="topbar">
    <h1><span class="dot-ico"></span> Maind X Eyes — states</h1>
    <nav class="pages">
      <a href="index.html">Appear</a>
      <a href="states.html" class="on">States</a>
    </nav>

    <div class="ctrl">
      <label for="spd">Tempo (× duration)</label>
      <input id="spd" type="range" min="0.6" max="1.6" step="0.05" value="1">
      <span class="val" id="spdVal"></span>
    </div>

    <div class="ctrl">
      <span class="seg" id="tint">
        <button data-tint="warm">Warm white</button>
        <button data-tint="cyan" class="on">EMO cyan</button>
      </span>
    </div>

    <button class="btn" id="replay">↻ Replay</button>
    <button class="btn" id="sound" aria-pressed="true">🔊 Sound</button>
    <button class="btn flow-btn" id="flow">▶ Simulate flow</button>
  </header>

  <main>
    <section class="featured">
      <div class="flowbar" id="flowbar" hidden>
        <span class="dotpulse"></span>
        <span class="phase" id="flowphase"></span>
        <button class="btn mic" id="wake">🎤 “Hey Arduino”</button>
      </div>
      <div class="stage round st-A3_idle" id="featStage">
        <div class="eyes">
          <div class="eye left"><div class="dot"></div></div>
          <div class="eye right"><div class="dot"></div></div>
        </div>
        <div class="clock"><b class="hh">--</b><b class="cl">:</b><b class="mm">--</b></div>
        <div class="check"><svg viewBox="0 0 100 100"><path d="M26 52 L44 70 L76 32"/></svg></div>
        <div class="bell"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></div>
        <div class="notes">
          <div class="pad">
            <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="ring r4"></span>
            <i class="ln l1"></i><i class="ln l2"></i><i class="write"></i>
          </div>
          <div class="hand"><div class="pen2"></div><div class="palm"></div></div>
        </div>
      </div>
      <div class="featured-meta">
        <div class="fname" id="fname"></div>
        <div class="fchips" id="fchips"></div>
        <div class="fdesc" id="fdesc"></div>
        <div class="finfo">
          <div class="firow light"><span class="ic"></span><b>Light</b><span id="flight"></span></div>
          <div class="firow sound"><span class="ic"></span><b>Sound</b><span id="fsound"></span></div>
        </div>
      </div>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <script src="state-anims.js"></script>
  <script src="sound.js"></script>
  <script src="states.js"></script>
</body>
</html>
