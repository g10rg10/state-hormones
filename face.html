<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maind X — face (alt, all states)</title>
  <link rel="stylesheet" href="face.css">
  <link rel="stylesheet" href="state-keyframes.css">
  <link rel="stylesheet" href="face-keyframes.css">
</head>
<body>
  <header class="topbar">
    <h1><span class="dot-ico"></span> Maind X — face (alt)</h1>
    <label class="power" title="Activate (face + mic) / Deactivate (clock only, mic off)">
      <input type="checkbox" id="power" checked>
      <span class="track"><span class="knob"></span></span>
      <span class="plabel">Active</span>
    </label>
    <a class="alt-link" href="/states.html">← states</a>

    <button class="btn" id="sound" aria-pressed="true">🔊 Sound</button>
    <button class="btn flow-btn" id="flow">▶ Simulate flow</button>
  </header>

  <main>
    <section class="grid grid-side" id="gridLeft"></section>

    <section class="featured">
      <div class="flowbar" id="flowbar" hidden>
        <span class="dotpulse"></span>
        <span class="phase" id="flowphase"></span>
        <button class="btn mic" id="wake">🎤 “Hey Arduino”</button>
      </div>
      <div class="stage round st-A3_idle" id="featStage">
        <div class="face">
          <div class="eyes">
            <div class="eye left"><div class="dot"></div></div>
            <div class="eye right"><div class="dot"></div></div>
          </div>
          <div class="mouth">
            <svg class="smile" viewBox="0 0 200 110" aria-hidden="true"><path d="M28 22 Q 100 110 172 22"/></svg>
            <span class="open"></span>
          </div>
        </div>
        <div class="clock"><b class="hh">--</b><b class="cl">:</b><b class="mm">--</b></div>
        <div class="check"><svg viewBox="0 0 100 100"><path d="M26 52 L44 70 L76 32"/></svg></div>
        <div class="bell"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></div>
        <div class="notes">
          <div class="pad">
            <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="ring r4"></span>
            <i class="ln l1"></i><i class="ln l2"></i><i class="ln l3"></i><i class="ln l4"></i>
          </div>
          <div class="pen"></div>
        </div>
      </div>
      <div class="featured-meta">
        <div class="fname" id="fname"></div>
        <div class="finfo">
          <div class="firow light"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg></span><b>Light</b><span id="flight"></span></div>
          <div class="firow sound"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></span><b>Sound</b><span id="fsound"></span></div>
        </div>
      </div>
    </section>

    <section class="grid grid-side" id="gridRight"></section>
  </main>

  <script src="state-anims.js"></script>
  <script src="sound.js"></script>
  <script src="face.js"></script>
</body>
</html>
